# FM-1 SID as the one module of its own firmware (dock/build_solo.sh: fm1-dock with only it and the sine):
# the module of dock/, with its tunes not compiled in but appended after the modules (PACK_AFTER_IMAGE:
# fm1sid.c finds the pack right after its image), so a package with other tunes needs no compiler
# (the web page appends a pack to web/fm1sid-base.bin).
name = FM-1 SID
version = 1
cflags = -DSID_COMB_CONST -DPACK_AFTER_IMAGE
includes = .. ../../src ../../player ../../ext/chips ../../build/dock
sources = ../fm1sid_module.c ../resid_glue.cc ../../src/sid.c ../../src/sidsynth.c ../../player/psid.c ../../player/gt2.c ../../player/gt2edit.c ../../ext/resid-0.16/sid.cc ../../ext/resid-0.16/voice.cc ../../ext/resid-0.16/wave.cc ../../ext/resid-0.16/envelope.cc ../../ext/resid-0.16/filter.cc ../../ext/resid-0.16/extfilt.cc ../../ext/resid-0.16/pot.cc ../../ext/resid-0.16/wave6581_PST.cc ../../ext/resid-0.16/wave6581_PS_.cc ../../ext/resid-0.16/wave6581_P_T.cc ../../ext/resid-0.16/wave6581__ST.cc ../../ext/resid-0.16/wave8580_PST.cc ../../ext/resid-0.16/wave8580_PS_.cc ../../ext/resid-0.16/wave8580_P_T.cc ../../ext/resid-0.16/wave8580__ST.cc 
cxxflags = -fno-exceptions -fno-rtti -w
libs = m c
