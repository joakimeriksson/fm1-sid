# FM-1 SID as an fm1-dock module (dock/README.md): firmware/fm1sid.c on dock_platform.h, the
# own model's tables as constants (SID_COMB_CONST: build/dock/sid_comb.h, tools/combtab.c), the tunes
# in build/dock/pack.c (dock/mkpack.py). Built by dock/build.sh with fm1-dock's tools/hbmod.py.
name = FM-1 SID
version = 1
cflags = -DSID_COMB_CONST
includes = ../src ../player ../ext/chips ../build/dock
sources = ../src/sid.c ../src/sidsynth.c ../player/psid.c ../player/gt2.c ../player/gt2edit.c ../build/dock/pack.c ../ext/resid-0.16/sid.cc ../ext/resid-0.16/voice.cc ../ext/resid-0.16/wave.cc ../ext/resid-0.16/envelope.cc ../ext/resid-0.16/filter.cc ../ext/resid-0.16/extfilt.cc ../ext/resid-0.16/pot.cc ../ext/resid-0.16/wave6581_PST.cc ../ext/resid-0.16/wave6581_PS_.cc ../ext/resid-0.16/wave6581_P_T.cc ../ext/resid-0.16/wave6581__ST.cc ../ext/resid-0.16/wave8580_PST.cc ../ext/resid-0.16/wave8580_PS_.cc ../ext/resid-0.16/wave8580_P_T.cc ../ext/resid-0.16/wave8580__ST.cc
cxxflags = -fno-exceptions -fno-rtti -w
libs = m c
